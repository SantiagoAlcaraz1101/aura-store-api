name: Verificar API
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aura_test
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: aura_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aura_test -d aura_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://aura_test:ci-only-disposable-password@127.0.0.1:5432/aura_test
      JWT_SECRET: ci-only-test-secret-not-used-for-deployment
      JWT_EXPIRES_IN: 1h
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: test
      SEED_DEMO_USERS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run typecheck:tests
      - run: npm test
