services:
  - type: web
    name: aura-store-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aura-store-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: FRONTEND_URL
        value: https://aura-store-azure.vercel.app
      - key: SEED_DEMO_USERS
        value: 'true'
databases:
  - name: aura-store-db
    plan: free
    region: oregon
    databaseName: aura_store
    user: aura_store
    postgresMajorVersion: '17'
